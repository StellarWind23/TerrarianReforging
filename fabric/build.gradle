plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/"}
    maven {url = "https://api.modrinth.com/maven"}
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Mod Menu
    compileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    runtimeOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    //Midnight lib
    implementation "maven.modrinth:codAaoxh:B2yvJDvr"

    common(project(':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    processResources {
        def properties = [
                maven_group              : rootProject.maven_group,
                modid                    : rootProject.modid,
                mod_name                 : rootProject.archives_name,
                mod_version              : project.version,
                author                   : rootProject.author,
                description              : rootProject.description,
                homepage_url             : rootProject.homepage_url,
                issues_url               : rootProject.issues_url,
                license                  : rootProject.license,
                java_version             : rootProject.java_version,
                fabric_api_version       : rootProject.fabric_api_version,
                fabric_loader_version    : rootProject.fabric_loader_version,
                minecraft_version        : rootProject.minecraft_version,
                architectury_api_version : rootProject.architectury_api_version,
                midnightlib_version      : rootProject.midnightlib_version
        ]

        inputs.properties properties

        filesMatching('fabric.mod.json') {
            expand properties
        }
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''   // this is the final, distributable jar
}

assemble.dependsOn shadowJar
