architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    // Fabric Loader is only here for the @Environment annotations.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // DO NOT USE ANY FABRIC SPECIFIC CLASSES!!!
    implementation "maven.modrinth:codAaoxh:B2yvJDvr"
}