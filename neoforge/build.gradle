plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {url = "https://api.modrinth.com/maven"}
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Midnight lib
    implementation "maven.modrinth:codAaoxh:WQfVY6eb"

    common(project(':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    processResources {
        def properties = [
                maven_group              : rootProject.maven_group,
                modid                    : rootProject.modid,
                mod_name                 : rootProject.archives_name,
                mod_version              : project.version,
                author                   : rootProject.author,
                description              : rootProject.description,
                homepage_url             : rootProject.homepage_url,
                issues_url               : rootProject.issues_url,
                license                  : rootProject.license,
                java_version             : rootProject.java_version,
                neoforge_version         : rootProject.neoforge_version,
                minecraft_version        : rootProject.minecraft_version,
                architectury_api_version : rootProject.architectury_api_version,
                midnightlib_version      : rootProject.midnightlib_version
        ]

        inputs.properties properties

        filesMatching('META-INF/neoforge.mods.toml') {
            expand properties
        }
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

assemble.dependsOn shadowJar
